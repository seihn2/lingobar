name: Standalone web build and synthetic sessions
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:web
      - run: npm run build:web
      - run: npm run verify:web
      - run: npm run test:web-ui
      - run: node scripts/test-web-auth-ui.cjs
      - run: node scripts/archive-web.cjs
        env:
          LINGOBAR_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          LINGOBAR_SOURCE_BASE: ${{ github.event.pull_request.base.sha || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-web-unconfigured-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/web/
            dist/WEB-MANIFEST.json
            dist/WEB-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-web-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/web-regression/
            artifacts/web-auth/
          if-no-files-found: warn
          retention-days: 14
