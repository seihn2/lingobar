name: Desktop build and synthetic tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows x64 build (synthetic audio only)
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/test-windows-storage.cjs
      - run: npm run package:win
      - run: npm run test:windows-native
      - run: npm run verify:package
      - run: npm run checksums:win
      - uses: actions/upload-artifact@v4
        with:
          name: LingoBar-windows-x64-${{ github.sha }}
          path: |
            dist/LingoBar-*-windows-x64-setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  macos:
    name: macOS arm64 regression build (synthetic audio only)
    runs-on: macos-15
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      LINGOBAR_NATIVE_ARCH: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:mac
      - run: resources/native/system-audio-capture --self-test
      - run: npm run verify:package
  ui:
    name: Chromium UI regression (synthetic captions)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-ui-evidence-${{ github.sha }}
          path: artifacts/ui-regression/
          if-no-files-found: warn
          retention-days: 14
