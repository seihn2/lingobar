name: Isolated touch review probe
on:
  push:
    branches: [codex/touch-review]
permissions:
  contents: read
concurrency:
  group: touch-review-probe
  cancel-in-progress: true
jobs:
  touch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web && npm run verify:web
      - run: npm run test:web-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: touch-review-probe-${{ github.sha }}
          path: artifacts/web-regression/
          if-no-files-found: warn
          retention-days: 14
